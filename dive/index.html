<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DIVE</title>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">DIVE</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>
    <p class="game-intro">Dive is a Threes-like game blending additive and multiplicative number theory.  
Tiles merge with their <strong>divisors</strong>.</p>
    <form method="post" name="gameModeForm" id="gameModeForm">
      <p class="game-intro">Seeds are: 
        <select id="gameModeSelect" name="gameModeSelect" onchange="changeGameMode()">
          <option value="0">
            2, 3, 5 and 7
          </option>
          <option value="1">
            any "prime" factor of a tile ever created
          </option>
          <option value="3" selected="selected">
            any "prime" factor of a tile on the board now
          </option>
        </select>
      </p>
    </form>
    <div class="currently-unlocked"></div>

    <div class="game-container">
      <div class="announcer"></div>
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>
    <div class="graph-container">
      <div style="border-radius:6px;overflow:hidden;">      
        <canvas class="graph"></canvas>
      </div>
    </div>
    <button onclick="downloadCSV()" style="margin:10px;">Download CSV</button>
    <br><br>
    <strong class="style-text" style="position:absolute;left:97.5px;top:15px;">Style</strong>
    <div class="color-picker">
      <input type="color" id="backgroundPicker1" style="margin:5px;width:50px;height:50px;border-radius:5px;">
      <input type="color" id="backgroundPicker2" style="margin:5px;width:50px;height:50px;border-radius:5px;">
      <input type="color" id="backgroundPicker3" style="margin:5px;width:50px;height:50px;border-radius:5px;">
    </div>
    
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_score_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
  <script src="js/colorpicker.js"></script>
  <script src="js/csv.js"></script>
</body>
</html>
